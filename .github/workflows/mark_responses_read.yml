name: Mark Responses Read

# Sets IsRead=Yes for a batch of response IDs, from the Responses page's
# "Sync read status" action — read/unread state is tracked persistently
# in the Response Sheet, not just in the browser's own session, but
# Streamlit itself never writes to any Sheet directly (it only ever has
# a read-only credential), so this goes through the same commit-then-
# trigger pattern as every other write in this app.
#
# Deliberately batched, not one run per response: opening a dozen
# replies in a session and triggering a full Actions run for each would
# be slow and wasteful. The Responses page accumulates newly-read keys
# locally and syncs them together.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name"
        required: true
      payload_path:
        description: "Path to the committed JSON payload file, e.g. mark_read/Foo/2026-08-30-143012.json"
        required: true

permissions:
  contents: write

jobs:
  mark-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Mark responses read
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          python outreach.py mark-responses-read --campaign "${{ github.event.inputs.campaign }}" \
            --file "${{ github.event.inputs.payload_path }}" | tee mark_read_output.txt
      - name: Add to job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat mark_read_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the processed payload file
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PAYLOAD_PATH="${{ github.event.inputs.payload_path }}"
          if [ -f "$PAYLOAD_PATH" ]; then
            git rm -f "$PAYLOAD_PATH"
            git commit -m "Remove processed mark-read payload: $PAYLOAD_PATH"
            # Push with retry-on-rebase: another workflow committing to
            # main between this job's checkout and this push is routine,
            # not exceptional, given how many workflows write to this
            # same branch — NOT a hypothetical, this exact rejection was
            # reported and reproduced against a live race. A bare
            # `git push` with no retry meant the ENTIRE cleanup step
            # failed outright on any such overlap, even though the
            # actual data operation (above) had already succeeded — only
            # this payload-file cleanup was ever at risk.
            MAX_ATTEMPTS=5
            pushed=false
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if git push; then
                echo "Pushed on attempt $attempt."
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt/$MAX_ATTEMPTS) -- another commit landed on main. Rebasing and retrying..."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase failed -- will retry from a fresh fetch."
              fi
              sleep $(( (RANDOM % 3) + 1 ))
            done
            if [ "$pushed" = false ]; then
              echo "::warning::Could not push payload cleanup after $MAX_ATTEMPTS attempts -- the actual data operation already succeeded; only this cleanup step is affected. The payload file will be removed on a future run."
            fi
          else
            echo "Payload file already gone — nothing to clean up."
          fi
