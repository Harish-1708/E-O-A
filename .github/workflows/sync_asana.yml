name: Sync Asana + Creator Tracker

# Two ways to trigger, matching the two things this needs to do:
#  - workflow_dispatch with a campaign input: the Settings tab's "Sync
#    to Asana Now" / "Sync Creator Tracker Sheet Now" buttons, for one
#    specific campaign, on demand.
#  - schedule: loops over EVERY campaign that has asana.enabled and/or
#    tracker_sync.enabled set to true (see outreach.py's
#    cmd_sync_asana_all) — not a single hardcoded default campaign,
#    since more than one campaign will have either turned on over time.
#
# Asana sync and Creator Tracker sync run independently of each other
# for every campaign — a campaign can have just one enabled without
# needing the other's credentials configured at all (see
# outreach.py's cmd_sync_asana / cmd_sync_asana_all).
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name — leave blank to sync every enabled campaign instead"
        required: false
  schedule:
    # Once an hour, but ONLY between 5:00 PM and 5:00 AM IST - the window that
    # covers US business hours. GitHub cron is always UTC and IST is UTC+5:30,
    # so this one line (minute 49 of UTC hours 11-22) fires at 5:19 PM,
    # 6:19 PM ... 4:19 AM IST: 12 runs a night, none outside the window.
    # Manual "Run workflow" and the in-app buttons are unaffected.
    # Sync Asana + Creator Tracker runs at IST :19 of every hour in the window.
    # Minute within each hour (IST): UGC Tracker Sync :04, Check Replies :07,
    # Auto Send :13, Sync Asana :19, Dashboard :25 - replies first, so a reply
    # is recorded before the next send decides who is due; all kept off :00 and
    # :30, the busiest moments on GitHub. GitHub's schedule is best-effort (a
    # run can arrive late or not at all), which is why every run is a full
    # sweep of what is due right now: a missed hour loses nothing, the next
    # run covers it.
    - cron: "49 11-22 * * *"   # 5:19 PM ... 4:19 AM IST

# Same reasoning as check_replies.yml's concurrency block: two overlapping
# syncs (a scheduled run and a manual click close together) could both
# decide the same lead needs a NEW Asana task at the same time, before
# either has written the resulting AsanaTaskGID back — that's exactly the
# duplicate-creation race this queues away instead of risking. The same
# overlap risk doesn't really apply to Creator Tracker sync (it never
# creates anything, only updates an existing cell), but queuing both
# together is simpler than splitting this into two separate workflows.
# Shared across every scheduled workflow that touches Google Sheets.
# Google's "read requests per minute" quota is per SERVICE ACCOUNT, not per
# workflow, so these all draw on ONE budget. The previous per-workflow groups
# only stopped a workflow overlapping ITSELF — two DIFFERENT workflows could
# still hit Sheets simultaneously and blow the quota, which is what produced
# the intermittent 429s. A shared group serialises them instead.
# cancel-in-progress: false means a run that is already going is NEVER killed.
# The limit that comes with it: GitHub keeps at most ONE run waiting per group.
# If another run queues while one is already waiting, the older waiting run is
# dropped (it shows as "Cancelled" — not an error) and the newer one takes its
# place. That is safe here because every scheduled run is a full sweep of what
# is due right now: a dropped run's work is picked up by the next one, and two
# runs still never overlap.
concurrency:
  group: google-sheets-api
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-asana:
    runs-on: ubuntu-latest
    # Holds the shared Sheets lock while it runs (see check_replies.yml).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sync Asana + Creator Tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_DEFAULT_ASSIGNEE_EMAIL: ${{ secrets.ASANA_DEFAULT_ASSIGNEE_EMAIL }}
          CREATOR_TRACKER_SHEET_ID: ${{ secrets.CREATOR_TRACKER_SHEET_ID }}
          CREATOR_TRACKER_WORKSHEET_NAME: ${{ secrets.CREATOR_TRACKER_WORKSHEET_NAME }}
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.campaign }}" ]; then
            python outreach.py sync-asana --campaign "${{ github.event.inputs.campaign }}" | tee sync_asana_output.txt
          else
            python outreach.py sync-asana-all | tee sync_asana_output.txt
          fi
      - name: Add to job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat sync_asana_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
