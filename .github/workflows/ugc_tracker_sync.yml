name: UGC Tracker Sync

# Deliberately its own workflow, its own concurrency group, its own
# schedule slot — entirely separate from the email outreach pipeline's
# "google-sheets-api" group, so this can never queue behind (or be
# queued behind by) auto-send, check-replies, dashboard, or the Asana
# sync those already use. A failure or slowdown here cannot affect
# that pipeline, and vice versa.
on:
  schedule:
    # Once an hour, around the clock. GitHub cron is always UTC, so the minute
    # below is minutes past each UTC hour. UGC Tracker Sync runs at :34.
    # Minute within each hour (UTC): UGC Tracker Sync :34, Check Replies :37,
    # Auto Send :43, Sync Asana :49, Dashboard :55 - replies first, so a reply
    # is recorded before the next send decides who is due. All kept off :00 and
    # :30, the busiest moments on GitHub.
    # Running every hour is harmless when nothing is due: Auto Send skips a
    # campaign outside its sending window without opening its Sheet, so only
    # runs inside a window do any work. GitHub's schedule is best-effort (a run
    # can arrive late or not at all), which is why every run is a full sweep of
    # what is due right now: a missed hour loses nothing, the next run covers
    # it. Manual "Run workflow" and the in-app buttons are unaffected.
    - cron: "34 * * * *"   # :34 past every hour
  workflow_dispatch: {}

concurrency:
  group: ugc-tracker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --break-system-packages \
            gspread==6.1.2 google-auth==2.34.0 requests>=2.31

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Reuses the SAME Asana token the Creator Outreach Asana sync
          # already uses elsewhere in this repo (ASANA_ACCESS_TOKEN) —
          # the script's own env var is still named ASANA_TOKEN
          # internally, mapped from that existing secret here rather
          # than adding a second Asana secret.
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          # Every one of these identifies a real, private company
          # resource (a specific Sheet, specific Drive folders, a
          # specific Asana project) — this repo is public, so none of
          # these are ever hardcoded in the script or written as a
          # literal argument here. Add all four under this repo's
          # Settings → Secrets and variables → Actions before the
          # first run:
          UGC_TRACKER_SHEET_ID: ${{ secrets.UGC_TRACKER_SHEET_ID }}
          UGC_TRACKER_RAW_FOLDER_ID: ${{ secrets.UGC_TRACKER_RAW_FOLDER_ID }}
          UGC_TRACKER_TIKTOK_FOLDER_ID: ${{ secrets.UGC_TRACKER_TIKTOK_FOLDER_ID }}
          # Optional — only add this one if automatic Shared Drive
          # discovery turns out not to work for your setup (a specific
          # 403 on that lookup itself, even with sharing and the
          # service account identity both confirmed correct). Safe to
          # leave unset otherwise; the script falls back to discovering
          # it automatically.
          UGC_TRACKER_SHARED_DRIVE_ID: ${{ secrets.UGC_TRACKER_SHARED_DRIVE_ID }}
          # If other scripts in this repo already hardcode the Creator
          # Outreach project's GID, set this secret to that same value
          # rather than changing anything else.
          UGC_TRACKER_ASANA_PROJECT_GID: ${{ secrets.UGC_TRACKER_ASANA_PROJECT_GID }}
          # Optional — the Rights Secured assignee swap. When BOTH are set,
          # every task in Rights Secured (existing and new) that is
          # assigned to the first person is reassigned to the second. Safe
          # to leave unset: nothing changes in Asana. Secrets, not
          # literals, because this repo is public and these are staff
          # email addresses. Tasks outside Rights Secured are never
          # touched, and sync-asana is unaffected (it only assigns its
          # default person to tasks with NO assignee, never overwriting
          # anyone else).
          UGC_TRACKER_REASSIGN_FROM_EMAIL: ${{ secrets.UGC_TRACKER_REASSIGN_FROM_EMAIL }}
          UGC_TRACKER_REASSIGN_TO_EMAIL: ${{ secrets.UGC_TRACKER_REASSIGN_TO_EMAIL }}
        run: |
          set -o pipefail
          python ugc_tracker_sync.py --worksheet-name Tracker | tee ugc_sync_output.txt

      - name: Add to job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ugc_sync_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
