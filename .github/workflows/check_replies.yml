name: Check Replies

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name — leave blank to check every campaign instead (this is what the scheduled run below always does)"
        required: false
        default: ""
  schedule:
    # Every 30 minutes, but ONLY between 5:00 PM and 5:00 AM IST — the
    # window that covers US business hours. GitHub cron is always UTC
    # and IST is UTC+5:30, so 5 PM-5 AM IST is 11:30-23:30 UTC (the
    # window never crosses midnight in UTC). The three lines below
    # make 24 runs a day, from 5:07 PM to 4:37 AM IST, and nothing
    # outside that. Manual "Run workflow" / in-app buttons are unaffected.
    # Check Replies runs at IST :07 and :37.
    # Minutes are staggered and kept off :00/:30 on purpose: GitHub's
    # own docs say scheduled runs are delayed (and some dropped) under
    # load, worst at the start of the hour. Cycle order each half hour,
    # IST: Check Replies :07, Auto Send :13, Sync Asana :19, Dashboard
    # :25 (UGC Tracker Sync :04, separate lock) — replies first, so a
    # reply is recorded before the next send decides who is due.
    - cron: "37 11 * * *"        # 5:07 PM IST
    - cron: "7,37 12-22 * * *"  # every half hour after that
    - cron: "7 23 * * *"             # 4:37 AM IST (last run of the night)

# Without this, the scheduled run and a manual "Check Replies Now" trigger
# (or two manual clicks close together) can execute at the same time on two
# separate runners. check_replies() reads "already logged" ONCE at the
# start of a run and never rechecks mid-run — so two overlapping runs can
# both see the same unread reply as "new" and both log it, producing exact
# duplicate rows in the Response Sheet. cancel-in-progress: false means the
# second run QUEUES and waits its turn instead of being killed mid-IMAP-
# fetch — we want every run to still happen, just never two at once.
# Shared across every scheduled workflow that touches Google Sheets.
# Google's "read requests per minute" quota is per SERVICE ACCOUNT, not per
# workflow, so these all draw on ONE budget. The previous per-workflow groups
# only stopped a workflow overlapping ITSELF — two DIFFERENT workflows could
# still hit Sheets simultaneously and blow the quota, which is what produced
# the intermittent 429s. A shared group serialises them instead.
# cancel-in-progress: false means a run that is already going is NEVER killed.
# The limit that comes with it: GitHub keeps at most ONE run waiting per group.
# If another run queues while one is already waiting, the older waiting run is
# dropped (it shows as "Cancelled" — not an error) and the newer one takes its
# place. That is safe here because every scheduled run is a full sweep of what
# is due right now: a dropped run's work is picked up by the next one, and two
# runs still never overlap.
concurrency:
  group: google-sheets-api
  cancel-in-progress: false

jobs:
  check-replies:
    runs-on: ubuntu-latest
    # Holds the shared Sheets lock while it runs, so a hung IMAP connection
    # must not be allowed to block auto-send and the rest for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check replies
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EMAIL_ACCOUNTS_JSON: ${{ secrets.EMAIL_ACCOUNTS_JSON }}
          EMAIL_ACCOUNT_SLOT_1: ${{ secrets.EMAIL_ACCOUNT_SLOT_1 }}
          EMAIL_ACCOUNT_SLOT_2: ${{ secrets.EMAIL_ACCOUNT_SLOT_2 }}
          EMAIL_ACCOUNT_SLOT_3: ${{ secrets.EMAIL_ACCOUNT_SLOT_3 }}
          EMAIL_ACCOUNT_SLOT_4: ${{ secrets.EMAIL_ACCOUNT_SLOT_4 }}
          EMAIL_ACCOUNT_SLOT_5: ${{ secrets.EMAIL_ACCOUNT_SLOT_5 }}
          EMAIL_ACCOUNT_SLOT_6: ${{ secrets.EMAIL_ACCOUNT_SLOT_6 }}
          EMAIL_ACCOUNT_SLOT_7: ${{ secrets.EMAIL_ACCOUNT_SLOT_7 }}
          EMAIL_ACCOUNT_SLOT_8: ${{ secrets.EMAIL_ACCOUNT_SLOT_8 }}
          EMAIL_ACCOUNT_SLOT_9: ${{ secrets.EMAIL_ACCOUNT_SLOT_9 }}
          EMAIL_ACCOUNT_SLOT_10: ${{ secrets.EMAIL_ACCOUNT_SLOT_10 }}
          # Optional — sales-intent classification (Interested / Not Interested /
          # Lead-Needs-Follow-up / Unclear) for each Genuine Reply. Leave this
          # secret unset entirely and everything works exactly as before, with
          # the Intent columns simply left blank.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # The actual bug this fixes: for a schedule-triggered run,
          # github.event.inputs is ALWAYS empty — there's no such thing
          # as an "input" outside of workflow_dispatch. The previous
          # version's `|| 'Kelson_Creators_Licensing'` fallback meant
          # EVERY scheduled run silently checked only that one hardcoded
          # campaign, no matter how many campaigns actually exist or
          # which one is the current active one — only a manual run
          # (which lets a human type a real campaign name) ever worked
          # correctly for anything else. Now: a manual run with a
          # campaign name checks just that one; a scheduled run (or a
          # manual run left blank) checks every campaign, regardless of
          # status, via check-replies-all.
          if [ -n "${{ github.event.inputs.campaign }}" ]; then
            python outreach.py check-replies --campaign "${{ github.event.inputs.campaign }}" | tee replies_output.txt
          else
            python outreach.py check-replies-all | tee replies_output.txt
          fi
      - name: Add to job summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat replies_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh dashboard
        if: always()
        continue-on-error: true  # a dashboard refresh failure should never mask the reply-check result above
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Same fix applied here — this previously had the identical
          # hardcoded-fallback bug. Always refreshes every campaign's
          # dashboard now, regardless of which one(s) were just checked
          # for replies above — simple, cheap, and never stale.
          python outreach.py dashboard --all
