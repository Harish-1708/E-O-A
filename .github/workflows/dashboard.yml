name: Update Dashboard

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name to update (leave blank if using 'Update all campaigns' below)"
        required: false
        default: ""
      update_all:
        description: "Update every configured campaign's dashboard, plus the combined All Campaigns Dashboard"
        type: boolean
        required: false
        default: false
  schedule:
    # Every 30 minutes, but ONLY between 5:00 PM and 5:00 AM IST — the
    # window that covers US business hours. GitHub cron is always UTC
    # and IST is UTC+5:30, so 5 PM-5 AM IST is 11:30-23:30 UTC (the
    # window never crosses midnight in UTC). The three lines below
    # make 24 runs a day, from 5:25 PM to 4:55 AM IST, and nothing
    # outside that. Manual "Run workflow" / in-app buttons are unaffected.
    # Update Dashboard runs at IST :25 and :55.
    # Minutes are staggered and kept off :00/:30 on purpose: GitHub's
    # own docs say scheduled runs are delayed (and some dropped) under
    # load, worst at the start of the hour. Cycle order each half hour,
    # IST: Check Replies :07, Auto Send :13, Sync Asana :19, Dashboard
    # :25 (UGC Tracker Sync :04, separate lock) — replies first, so a
    # reply is recorded before the next send decides who is due.
    - cron: "55 11 * * *"        # 5:25 PM IST
    - cron: "25,55 12-22 * * *"  # every half hour after that
    - cron: "25 23 * * *"             # 4:55 AM IST (last run of the night)

# Shared across every scheduled workflow that touches Google Sheets.
# Google's "read requests per minute" quota is per SERVICE ACCOUNT, not per
# workflow, so these all draw on ONE budget. The previous per-workflow groups
# only stopped a workflow overlapping ITSELF — two DIFFERENT workflows could
# still hit Sheets simultaneously and blow the quota, which is what produced
# the intermittent 429s. A shared group serialises them instead.
# cancel-in-progress: false means a run that is already going is NEVER killed.
# The limit that comes with it: GitHub keeps at most ONE run waiting per group.
# If another run queues while one is already waiting, the older waiting run is
# dropped (it shows as "Cancelled" — not an error) and the newer one takes its
# place. That is safe here because every scheduled run is a full sweep of what
# is due right now: a dropped run's work is picked up by the next one, and two
# runs still never overlap.
concurrency:
  group: google-sheets-api
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    # Holds the shared Sheets lock while it runs (see check_replies.yml).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Update dashboard(s)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.update_all }}" = "true" ] || [ -z "${{ github.event.inputs.campaign }}" ]; then
            python outreach.py dashboard --all | tee dashboard_output.txt
          else
            python outreach.py dashboard --campaign "${{ github.event.inputs.campaign }}" | tee dashboard_output.txt
          fi
      - name: Add to job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dashboard_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
